name: Build Abuja map file

# Cuts the Abuja area out of the latest Protomaps (OpenStreetMap) world build
# and commits it as public/abuja.pmtiles. Run it from the Actions tab to refresh the map.
on:
  workflow_dispatch:
  push:
    branches: [own-map-maplibre]
    paths: [.github/workflows/build-map.yml]

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pmtiles
        run: |
          curl -sSL -o pmtiles.tar.gz https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          tar -xzf pmtiles.tar.gz pmtiles
          sudo mv pmtiles /usr/local/bin/
          pmtiles version

      - name: Find the newest world build
        run: |
          for i in $(seq 0 14); do
            d=$(date -u -d "-$i day" +%Y%m%d)
            if curl -sfI "https://build.protomaps.com/$d.pmtiles" > /dev/null; then
              echo "BUILD=$d" >> "$GITHUB_ENV"; echo "Using $d"; exit 0
            fi
          done
          echo "No recent build found"; exit 1

      - name: Extract Abuja
        run: |
          mkdir -p public
          pmtiles extract "https://build.protomaps.com/$BUILD.pmtiles" public/abuja.pmtiles \
            --bbox=7.20,8.80,7.70,9.25 --maxzoom=15
          ls -lh public/abuja.pmtiles

      - name: Commit the map file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/abuja.pmtiles
          git diff --cached --quiet && { echo "Map unchanged"; exit 0; }
          git commit -m "Update Abuja map file (Protomaps build $BUILD)"
          git push
